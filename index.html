:root{
  --bg:#f6f0e8; --paper:#fffaf3; --ink:#332d29; --muted:#776e66;
  --accent:#b86b61; --accent2:#d9a39a; --line:#eadfd3;
  --shadow:0 18px 50px rgba(64,45,35,.10);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.30), transparent 28%),
    radial-gradient(circle at 85% 80%, rgba(255,255,255,.22), transparent 30%),
    var(--page-bg);
  transition: background .35s ease;
}
body.page-home{--page-bg:#d8f2df;}
body.page-us{--page-bg:#f7d9e5;}
body.page-know{--page-bg:#d9ebf7;}
body.page-adventure{--page-bg:#e5dcf4;}
body.page-future{--page-bg:#f7edc8;}
body.page-random{--page-bg:#f8dec9;}
button{font:inherit}
.app{max-width:900px;margin:auto;padding:42px 20px 60px}
header{text-align:center;margin-bottom:34px}
.eyebrow{font:12px/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(42px,8vw,72px);font-weight:400;margin:8px 0 8px}
.subtitle{font-size:18px;color:var(--muted);margin:0}
.screen{display:none}
.screen.active{display:block}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{
  border:1px solid var(--line); background:rgba(255,250,243,.86);
  border-radius:24px;padding:24px;min-height:155px;text-align:left;
  cursor:pointer;box-shadow:0 8px 25px rgba(64,45,35,.05);
  transition:.2s transform,.2s box-shadow,.2s border-color;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent2)}
.icon{font-size:28px}.card h2{font-size:23px;font-weight:400;margin:12px 0 6px}
.card p{margin:0;color:var(--muted);font:14px/1.5 Arial,sans-serif}
.question-wrap{max-width:720px;margin:20px auto}
.category-label{font:12px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-align:center}
.question-card{
  background:var(--paper);border:1px solid var(--line);border-radius:30px;
  padding:clamp(30px,7vw,65px) clamp(24px,7vw,70px);
  text-align:center;box-shadow:var(--shadow);min-height:360px;
  display:flex;flex-direction:column;justify-content:center;
}
.question{font-size:clamp(27px,5vw,42px);line-height:1.22;font-weight:400;margin:20px 0 18px}
.hint{font:14px/1.5 Arial,sans-serif;color:var(--muted);max-width:480px;margin:auto}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.btn{
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:12px 18px;cursor:pointer;transition:.2s;
}
.btn:hover{transform:translateY(-1px);border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.saved{background:#e9d7c0;border-color:#e9d7c0}
.back{display:inline-block;margin-bottom:18px;background:none;border:0;color:var(--muted);cursor:pointer;padding:5px}
.favorites{margin-top:36px}
.section-title{text-align:center;font-size:25px;font-weight:400;margin:0 0 14px}
.saved-list{display:grid;gap:10px}
.saved-item{
  background:rgba(255,250,243,.8);border:1px solid var(--line);border-radius:16px;
  padding:15px 17px;display:flex;justify-content:space-between;gap:15px;align-items:center
}
.saved-text{font-size:16px;line-height:1.4}
.remove{border:0;background:none;color:var(--muted);cursor:pointer}
.empty{text-align:center;color:var(--muted);font:14px Arial,sans-serif}
.footer{text-align:center;margin-top:38px;color:#9b9188;font:12px Arial,sans-serif}
@media(max-width:560px){.app{padding-top:28px}.categories{grid-template-columns:1fr}.card{min-height:125px}.question-card{min-height:420px}}
</style>

      "Jaka jest najbardziej losowa rzecz, której chciałbyś kiedyś spróbować?",
      "Gdybyśmy mieli wymyślić własne święto, co byśmy świętowali?",
      "Gdyby nasze mieszkanie mogło mówić, co powiedziałoby o nas?",
      "Gdybyś miał wymyślić pseudonim dla naszego związku, jaki?",
      "Jaki byłby najbardziej absurdalny wspólny projekt, który moglibyśmy zrobić?"
    ]
  }
};

let currentCategory = null;
let currentQuestion = null;
let lastIndex = -1;
const saved = JSON.parse(localStorage.getItem("ourFavorites") || "[]");

const $ = id => document.getElementById(id);

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  if(id === "home"){
    document.body.className = "page-home";
  } else {
    const pageClass = {
      us: "page-us",
      know: "page-know",
      adventure: "page-adventure",
      future: "page-future",
      random: "page-random"
    }[currentCategory] || "page-home";
    document.body.className = pageClass;
  }
  window.scrollTo({top:0,behavior:"smooth"});
}

function pickQuestion(){
  const pool = currentCategory === "all"
    ? Object.values(categories).flatMap(c=>c.questions)
    : categories[currentCategory].questions;
  if(pool.length === 1) return pool[0];
  let index;
  do { index = Math.floor(Math.random()*pool.length); } while(index === lastIndex);
  lastIndex = index;
  currentQuestion = pool[index];
  $("question").textContent = currentQuestion;
  $("categoryLabel").textContent = currentCategory === "all" ? "Wszystko" : categories[currentCategory].name;
  const isSaved = saved.includes(currentQuestion);
  $("saveBtn").textContent = isSaved ? "★ Zapisane" : "☆ Zapisz";
  $("saveBtn").classList.toggle("saved",isSaved);
}

function openCategory(cat){
  currentCategory = cat;
  lastIndex = -1;
  showScreen("questionScreen");
  pickQuestion();
}

document.querySelectorAll("[data-cat]").forEach(btn=>{
  btn.addEventListener("click",()=>openCategory(btn.dataset.cat));
});

$("nextBtn").addEventListener("click",pickQuestion);
$("backBtn").addEventListener("click",()=>{renderSaved();showScreen("home")});

$("saveBtn").addEventListener("click",()=>{
  const i = saved.indexOf(currentQuestion);
  if(i >= 0) saved.splice(i,1);
  else saved.push(currentQuestion);
  localStorage.setItem("ourFavorites",JSON.stringify(saved));
  pickQuestion(); renderSaved();
});

function renderSaved(){
  const box=$("savedList");
  if(!saved.length){
    box.innerHTML='<div class="empty">Jeszcze nic tutaj nie ma. Zapisz pytanie, do którego chcesz kiedyś wrócić.</div>';
    return;
  }
  box.innerHTML="";
  saved.forEach((q,i)=>{
    const row=document.createElement("div");
    row.className="saved-item";
    row.innerHTML=`<div class="saved-text">${q}</div><button class="remove" aria-label="Usuń">×</button>`;
    row.querySelector(".remove").onclick=()=>{
      saved.splice(i,1);
      localStorage.setItem("ourFavorites",JSON.stringify(saved));
      renderSaved();
    };
    box.appendChild(row);
  });
}
renderSaved();
</script>
</body>
</html>
